<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0F19"/>
      <stop offset="0.5" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- Ambient Glow Circles -->
  <circle cx="1020" cy="100" r="160" fill="#6366F1" fill-opacity="0.18" filter="url(#blurFilter)"/>
  <circle cx="200" cy="240" r="140" fill="#06B6D4" fill-opacity="0.15" filter="url(#blurFilter)"/>
  <circle cx="700" cy="160" r="120" fill="#A855F7" fill-opacity="0.12" filter="url(#blurFilter)"/>

  <!-- Subtle Grid Overlay -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="80" y1="80" x2="1120" y2="80"/>
    <line x1="80" y1="160" x2="1120" y2="160"/>
    <line x1="80" y1="240" x2="1120" y2="240"/>
  </g>

  <!-- Main Glassmorphism Card -->
  <rect x="70" y="55" width="700" height="210" rx="20" fill="#0F172A" fill-opacity="0.75" stroke="url(#accent)" stroke-width="1.5"/>

  <!-- Header & Typography -->
  <text x="105" y="118" fill="#F8FAFC" font-family="'Segoe UI', Inter, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">Kethmika Thewjan</text>
  
  <!-- Role Badges Pills -->
  <rect x="105" y="140" width="180" height="28" rx="14" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
  <text x="120" y="159" fill="#38BDF8" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600">Full Stack Developer</text>

  <rect x="295" y="140" width="90" height="28" rx="14" fill="#6366F1" fill-opacity="0.2" stroke="#818CF8" stroke-width="1"/>
  <text x="317" y="159" fill="#818CF8" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600">DevOps</text>

  <rect x="395" y="140" width="150" height="28" rx="14" fill="#A855F7" fill-opacity="0.2" stroke="#C084FC" stroke-width="1"/>
  <text x="415" y="159" fill="#C084FC" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600">UI/UX Designer</text>

  <!-- Bio / Taglines -->
  <text x="105" y="202" fill="#CBD5E1" font-family="'Segoe UI', Inter, sans-serif" font-size="16" font-weight="400">Architecting modern web applications, scalable cloud infrastructure & intuitive interfaces.</text>
  <text x="105" y="228" fill="#64748B" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="500">MERN Stack • Next.js • React Native • Docker • Cloud Deployments • Figma</text>

  <!-- Right Visual Widget: Code & Deploy Badge -->
  <rect x="830" y="55" width="300" height="210" rx="20" fill="#0B1220" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Mini Terminal Header -->
  <circle cx="856" cy="82" r="5" fill="#EF4444"/>
  <circle cx="872" cy="82" r="5" fill="#F59E0B"/>
  <circle cx="888" cy="82" r="5" fill="#10B981"/>
  <text x="910" y="86" fill="#64748B" font-family="'Courier New', monospace" font-size="12">developer@tmkthewjan:~</text>

  <!-- Terminal Code Highlights -->
  <text x="855" y="125" fill="#38BDF8" font-family="'Fira Code', 'Courier New', monospace" font-size="13" font-weight="600">$ dev.build()</text>
  <text x="855" y="150" fill="#10B981" font-family="'Fira Code', 'Courier New', monospace" font-size="13">✓ Status: Ready to Deploy</text>
  <text x="855" y="175" fill="#A78BFA" font-family="'Fira Code', 'Courier New', monospace" font-size="13">⚙ Stack: Next.js + Node + PostGIS</text>
  <text x="855" y="200" fill="#F472B6" font-family="'Fira Code', 'Courier New', monospace" font-size="13">🎨 UI/UX: Pixel-Perfect &amp; Accessible</text>
  <text x="855" y="228" fill="#38BDF8" font-family="'Fira Code', 'Courier New', monospace" font-size="13" font-weight="700">&gt; Building what matters_</text>
</svg>
